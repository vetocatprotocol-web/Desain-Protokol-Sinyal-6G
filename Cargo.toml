[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/phy",
]
exclude = []

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1

[profile.bench]
opt-level = 3
lto = true
codegen-units = 1
