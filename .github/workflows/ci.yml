name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 2 * * 0'

env:
  RUSTFLAGS: '-D warnings'
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check (fmt, clippy, deny, audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D clippy::pedantic -D clippy::nursery -D warnings
      - name: deny check
        run: |
          cargo install cargo-deny --locked
          cargo deny check
      - name: audit
        run: |
          cargo install cargo-audit --locked
          cargo audit

  test:
    name: Test (unit, doc, integration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Unit & doc tests
        run: cargo test --workspace --all-features --lib --doc
      - name: Integration tests
        run: cargo test --workspace --all-features --tests

  property-test:
    name: Property Tests (proptest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Property tests
        run: cargo test --workspace --all-features proptest -- --test-threads=4

  golden-vectors:
    name: Golden Vector Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Golden vector tests
        run: cargo test --workspace --all-features golden -- --test-threads=1

  determinism:
    name: Determinism Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Run sim twice and compare
        run: |
          cargo build --release --workspace --all-features -p sim
          ./target/release/sim --seed 12345 --slots 1000 > run1.bin
          ./target/release/sim --seed 12345 --slots 1000 > run2.bin
          cmp run1.bin run2.bin && echo "Deterministic: OK"

  fuzz:
    name: Fuzzing
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-nightly-${{ hashFiles('**/Cargo.lock') }}
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Fuzz frame parser
        run: |
          cd fuzz
          cargo fuzz run frame_parser -- -max_total_time=1800
      - name: Fuzz decoder
        run: |
          cd fuzz
          cargo fuzz run decoder -- -max_total_time=1800

  miri:
    name: MIRI (UB detection)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-miri-${{ hashFiles('**/Cargo.lock') }}
      - name: Run MIRI on core and phy
        run: |
          cargo miri test --workspace -p core -p phy --all-features

  sanitizers:
    name: Sanitizers (ASan, TSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-san-${{ hashFiles('**/Cargo.lock') }}
      - name: Install sanitizer deps
        run: |
          sudo apt-get update && sudo apt-get install -y llvm clang
      - name: AddressSanitizer
        run: |
          RUSTFLAGS="-Z sanitizer=address" cargo test --workspace -p core -p phy --all-targets --all-features
      - name: ThreadSanitizer
        run: |
          RUSTFLAGS="-Z sanitizer=thread" cargo test --workspace -p core -p phy --all-targets --all-features

  bench:
    name: Benchmarks (iai-callgrind)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-bench-${{ hashFiles('**/Cargo.lock') }}
      - name: Install iai-callgrind
        run: cargo install iai-callgrind --locked
      - name: Run benchmarks
        run: cargo bench --workspace --all-features
      - name: Compare with baseline
        run: |
          cargo iai-callgrind --workspace --all-features
          # Check for regressions > 3% throughput, > 5% latency p99
          # This would be implemented as a custom step comparing benches/baselines/

  coverage:
    name: Coverage (llvm-cov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-cov-${{ hashFiles('**/Cargo.lock') }}
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked
      - name: Generate coverage
        run: cargo llvm-cov --workspace --all-features --lcov --output-path lcov.info
      - name: Check coverage thresholds
        run: |
          cargo llvm-cov --workspace --all-features --summary-only
          # Core must have >= 90% line coverage, unsafe 100%
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          fail_ci_if_error: true

  msrv:
    name: MSRV Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.75.0
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-msrv-${{ hashFiles('**/Cargo.lock') }}
      - name: Test MSRV
        run: cargo test --workspace --all-features

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-docs-${{ hashFiles('**/Cargo.lock') }}
      - name: Build docs
        run: cargo doc --workspace --all-features --no-deps
      - name: Test doc examples
        run: cargo test --workspace --all-features --doc

  notify:
    name: Notify on Failure
    needs: [check, test, property-test, golden-vectors, determinism, fuzz, miri, sanitizers, bench, coverage, msrv, docs]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Notify
        run: echo "CI failed - check workflow logs"